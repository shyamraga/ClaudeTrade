[project]
name = "claude-trade-backend"
version = "0.1.0"
description = "Claude Trade — hybrid trading simulator & algo bot backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "websockets==14.1",
    "pydantic==2.10.1",
    "pydantic-settings==2.6.1",
    "httpx==0.27.2",
    "anyio==4.7.0",
    "apscheduler==3.10.4",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
